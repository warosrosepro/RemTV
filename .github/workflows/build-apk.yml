name: Build RemTV APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare project sources
        id: project
        shell: bash
        run: |
          set -euo pipefail

          # Prefer an already extracted project. If the repository contains only
          # the uploaded source archive, extract it into a temporary workspace.
          if find . -maxdepth 4 -type f -name build.sh -not -path './.git/*' | grep -q .; then
            PROJECT_DIR="$(dirname "$(find . -maxdepth 4 -type f -name build.sh -not -path './.git/*' | head -n 1)")"
          elif [ -f source.zip ]; then
            mkdir -p _build_source
            unzip -q source.zip -d _build_source
            PROJECT_DIR="$(dirname "$(find _build_source -maxdepth 6 -type f -name build.sh | head -n 1)")"
          else
            echo "::error::Не найден build.sh. Загрузите в корень репозитория распакованные файлы проекта или source.zip."
            exit 1
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/build.sh" ]; then
            echo "::error::Архив распакован, но build.sh внутри не найден."
            exit 1
          fi

          # The project builds a development APK with a temporary debug key.
          # Never use or publish a keystore bundled in a source archive.
          find "$PROJECT_DIR" -type f -name '*.keystore' -delete
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RemTV-APK
          path: ${{ steps.project.outputs.dir }}/build/RemTV.apk
          if-no-files-found: error
          retention-days: 14
